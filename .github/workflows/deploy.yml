# Builds the app and publishes it to GitHub Pages (https://riteshshete.github.io/sellbook/)
# on every push to main. Work happens on branches; merging to main is the release.
# Needs: repo public (free plan), Pages source = "GitHub Actions", and repository variables
# VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY (the public anon key only; never an admin or secret key).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build for /sellbook/
        run: npm run build
        env:
          BASE_PATH: /sellbook/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # GitHub Pages has no rewrites: serving index.html as the 404 page lets deep links
      # (/sellbook/orders/123, a refresh, the installed app) open the app, which then routes.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
