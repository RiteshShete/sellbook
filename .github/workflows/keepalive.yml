# Keeps the free Supabase project from pausing after 7 days without traffic: one tiny request every 3 days.
# Uses only the PUBLIC anon key (the same repository variables the deploy uses); ping() is a no-op function.
# GitHub switches scheduled workflows off after 60 days without any repository activity: a push or
# "Run workflow" on this page turns it back on. Real shop traffic keeps the project awake on its own.
name: Keep alive

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping()
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$URL" && test -n "$KEY"
          curl --fail --silent --show-error --max-time 30 -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
